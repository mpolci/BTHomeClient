<div id="boat-history-wireframe" aria-label="History phone wireframe">
  <style>
    #boat-history-wireframe { --boat-bg:light-dark(#fafafa,#202020); --boat-ink:light-dark(#252525,#ededed); --boat-line:light-dark(#c8c8c8,#606060); --boat-soft:light-dark(#eeeeee,#303030); color:var(--boat-ink); font-family:system-ui,sans-serif; }
    #boat-history-wireframe * { box-sizing:border-box; }
    #boat-history-wireframe .phone { max-width:390px; height:740px; display:flex; flex-direction:column; margin:auto; background:var(--boat-bg); border:1px solid var(--boat-line); border-radius:22px; overflow:hidden; }
    #boat-history-wireframe [hidden] { display:none !important; }
    #boat-history-wireframe header, #boat-history-wireframe footer, #boat-history-wireframe .time-dock { flex-shrink:0; }
    #boat-history-wireframe header { padding:18px 16px 12px; border-bottom:1px solid var(--boat-line); }

    #boat-history-wireframe label { flex:1; min-width:120px; font-size:13px; }
    #boat-history-wireframe select, #boat-history-wireframe button { font:inherit; color:var(--boat-ink); background:var(--boat-bg); border:1px solid var(--boat-line); border-radius:8px; min-height:44px; padding:8px 10px; cursor:pointer; }
    #boat-history-wireframe select { display:block; width:100%; margin-top:4px; font-size:16px; }
    #boat-history-wireframe button:focus-visible, #boat-history-wireframe select:focus-visible { outline:2px solid var(--boat-ink); outline-offset:2px; }
    #boat-history-wireframe .content { flex:1; min-height:0; overflow-y:auto; padding:12px 16px; }
    #boat-history-wireframe .sensor { display:block; width:100%; padding:12px; margin-bottom:12px; text-align:left; }
    #boat-history-wireframe .sensor-head { display:flex; justify-content:space-between; gap:8px; font-weight:500; }
    #boat-history-wireframe .summary { font-size:13px; display:block; margin-top:8px; }
    #boat-history-wireframe svg { display:block; width:100%; overflow:visible; }
    #boat-history-wireframe svg text { fill:var(--boat-ink); font:12px system-ui,sans-serif; }
    #boat-history-wireframe .grid { stroke:var(--boat-line); stroke-width:1; }
    #boat-history-wireframe .trend { fill:none; stroke:var(--boat-ink); stroke-width:2; stroke-linejoin:round; }
    #boat-history-wireframe .comparison { stroke-dasharray:5 4; }
    #boat-history-wireframe .back { border:0; padding-left:0; }
    #boat-history-wireframe .legend { font-size:13px; margin:12px 0; }
    #boat-history-wireframe footer { padding:10px 16px; border-top:1px solid var(--boat-line); font-size:12px; }
    #boat-history-wireframe .timeline { position:relative; height:48px; margin:8px 14px 0; background:var(--boat-soft); border-radius:6px; }
    #boat-history-wireframe .window { position:absolute; top:0; height:48px; background:var(--boat-bg); border:2px solid var(--boat-ink); border-radius:6px; }
    #boat-history-wireframe .timeline button { position:absolute; top:0; height:48px; min-height:44px; padding:0; touch-action:none; user-select:none; }
    #boat-history-wireframe .pan { inset:0; width:100%; border:0; cursor:grab; background:var(--boat-soft); }
    #boat-history-wireframe .handle { width:28px; z-index:2; cursor:ew-resize; }
    #boat-history-wireframe .start { left:-14px; }
    #boat-history-wireframe .end { right:-14px; }
    #boat-history-wireframe .timeline-labels { display:flex; justify-content:space-between; margin:4px 0 10px; font-size:12px; }
    #boat-history-wireframe .time-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #boat-history-wireframe .all-time { font-size:12px; }
    #boat-history-wireframe .heading { display:flex; align-items:center; gap:8px; }
    #boat-history-wireframe .detail header { padding:8px 16px; }
    #boat-history-wireframe .detail h2 { font-size:18px; margin:0; }
    #boat-history-wireframe .detail .controls { margin:4px 0 0; }
    #boat-history-wireframe .detail .controls label { display:flex; align-items:center; gap:12px; }
    #boat-history-wireframe .detail select { flex:1; width:auto; margin:0; }
    #boat-history-wireframe .detail .content { display:flex; flex-direction:column; gap:8px; overflow:hidden; }
    #boat-history-wireframe .detail-plot { flex:1; min-height:0; }
    #boat-history-wireframe .detail-plot svg { height:100%; }
    #boat-history-wireframe .detail .summary { margin:0; }
    #boat-history-wireframe .detail .legend { margin:0; font-size:12px; }
    #boat-history-wireframe .comparison-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    #boat-history-wireframe .comparison-row button { font-size:13px; flex-shrink:0; }
    #boat-history-wireframe .time-dock { padding:0 16px; border-top:1px solid var(--boat-line); }
    #boat-history-wireframe .phone.detail { position:relative; width:100%; max-width:740px; height:390px; border-radius:16px; }
    #boat-history-wireframe .detail header { position:absolute; z-index:3; top:8px; left:8px; right:8px; padding:0 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--boat-bg); border:0; border-radius:8px; }
    #boat-history-wireframe .detail .heading { min-width:0; }
    #boat-history-wireframe .detail h2 { font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #boat-history-wireframe .detail .controls { margin:0; flex-shrink:0; }
    #boat-history-wireframe .detail .controls label { min-width:0; }
    #boat-history-wireframe .detail .measurement-label { display:none; }
    #boat-history-wireframe .detail select { font-size:14px; padding:4px; border:0; }
    #boat-history-wireframe .detail .content { position:absolute; inset:58px 0 8px; padding:0 12px; display:block; overflow:hidden; touch-action:none; user-select:none; cursor:grab; }
    #boat-history-wireframe .detail .detail-plot { height:100%; }
    #boat-history-wireframe .detail .summary, #boat-history-wireframe .detail .comparison-row, #boat-history-wireframe .detail footer { display:none; }
    #boat-history-wireframe .detail .time-dock { position:absolute; z-index:4; bottom:52px; left:12px; right:12px; padding:8px 16px; background:var(--boat-bg); border:1px solid var(--boat-line); border-radius:8px; }
    #boat-history-wireframe .overlay-bar { position:absolute; z-index:3; top:80px; right:20px; }
    #boat-history-wireframe .overlay-bar button { width:44px; height:44px; padding:10px; border-radius:50%; background:var(--boat-bg); }
    #boat-history-wireframe .overlay-bar svg { width:22px; height:22px; }
    #boat-history-wireframe .sample-readout { position:absolute; z-index:4; bottom:38px; left:64px; max-width:calc(100% - 84px); padding:8px 10px; border:1px solid var(--boat-line); border-radius:6px; background:var(--boat-bg); font-size:12px; pointer-events:none; }
    #boat-history-wireframe .sample-readout p { margin:4px 0; }
    #boat-history-wireframe .cursor-line { stroke:var(--boat-ink); stroke-width:1; stroke-dasharray:3 3; }
    #boat-history-wireframe .cursor-mark { fill:var(--boat-bg); stroke:var(--boat-ink); stroke-width:2; }
    #boat-history-wireframe .detail-legend { position:absolute; z-index:2; top:54px; right:20px; font-size:12px; background:var(--boat-bg); padding:0 4px; }
    #boat-history-wireframe .detail .status { position:absolute; top:42px; left:56px; font-size:11px; background:var(--boat-bg); }
    #boat-history-wireframe .detail .retry { position:absolute; z-index:6; right:20px; bottom:10px; font-size:12px; background:var(--boat-bg); }
    #boat-history-wireframe .history-empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
    #boat-history-wireframe .history-empty h3 { font-size:20px; font-weight:500; margin:8px 0; }
    #boat-history-wireframe .history-empty p { margin:8px 0; max-width:420px; }
    #boat-history-wireframe .detail .history-empty .retry { position:static; margin-top:12px; }
    #boat-history-wireframe .history-empty progress { width:160px; height:6px; accent-color:var(--boat-ink); }
    @media(max-width:440px) { #boat-history-wireframe .detail h2 { max-width:125px; } #boat-history-wireframe .overlay-bar button { font-size:12px; padding:4px; } }
  </style>
  <section class="phone">
    <header>
      <div class="note prototype-label">Wireframe · illustrative data</div>
      <div class="heading"><button class="back" type="button" aria-label="Back to history overview" hidden>←</button><h2>History</h2></div>
      <div class="controls">
        <label><span class="measurement-label">Measurement</span><select class="metric" aria-label="Measurement"><option value="temperature">Temperature</option><option value="humidity">Humidity</option><option value="pressure">Pressure</option></select></label>
      </div>
      <div class="time-navigation">
      <div class="time-heading"><p class="note dates" aria-live="polite"></p><button class="all-time" type="button">All history</button></div>
      <div class="timeline" aria-label="Available history from March to August 2026">
        <div class="window">
          <button class="pan" type="button" aria-label="Move selected period; use left and right arrow keys">↔</button>
          <button class="handle start" type="button" aria-label="Adjust start date; use left and right arrow keys">Ⅰ</button>
          <button class="handle end" type="button" aria-label="Adjust end date; use left and right arrow keys">Ⅰ</button>
        </div>
      </div>
      <div class="timeline-labels"><span>Mar 2026</span><span>Aug 2026</span></div>
      </div>
      <p class="note status" aria-live="polite">Updating saved sensors… · demo</p>
      <button class="retry" type="button" hidden>Try again</button>
    </header>
    <div class="content"></div>
    <div class="time-dock" hidden></div>
    <div class="detail-legend" hidden></div>
    <div class="overlay-bar" hidden><button class="overlay-compare" type="button" aria-label="Compare with Outdoors" data-tooltip="Compare with Outdoors"><i data-lucide="layers-2" aria-hidden="true"></i></button></div>
    <div class="sample-readout" role="status" aria-live="polite" hidden></div>
    <footer>Wireframe · illustrative historical data</footer>
  </section>
  <script>
    (() => {
      const root = document.getElementById('boat-history-wireframe');
      const content = root.querySelector('.content');
      const retryButton = root.querySelector('.retry');
      const timeNavigation = root.querySelector('.time-navigation');
      const names = ['Forward cabin', 'Dinette', 'Outdoors'];
      const escapeMarkup = value => String(value).replace(/[&<>"']/g,c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const state = { selected:null, compare:false, density:'comfortable', start:0, end:183, inspected:null };
      let updateRoute = null;
      let updateTimer = null;
      let externalBack = null;
      let directEntry = false;
      let visibleSensors = [0,1,2];
      let detailGeometry = null;
      let connected = null;
      const hasData = index => !connected || connected.hasData(index);
      const comparisonFor = index => visibleSensors.find(i => i!==index && i===2 && hasData(i)) ?? visibleSensors.find(i => i!==index && hasData(i)) ?? null;
      const lastDay = 183;
      const minimumSpan = 35;
      const dateLabel = day => new Date(Date.UTC(2026,2,1+day)).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
      const series = {
        temperature:[[11,13,8,16,17,20,18,23,29,24,26,25],[13,14,11,17,19,22,21,25,32,26,28,27],[8,11,5,13,15,18,16,21,27,22,24,23]],
        humidity:[[65,70,85,76,67,63,72,60,58,62,64,68],[60,65,80,71,62,58,67,55,53,57,59,63],[72,77,90,83,74,70,79,67,65,69,71,75]],
        pressure:[[1014,1010,997,1020,1018,1012,1025,1019,1011,1016,1021,1017],[1014,1010,997,1020,1018,1012,1025,1019,1011,1016,1021,1017],[1014,1010,997,1020,1018,1012,1025,1019,1011,1016,1021,1017]]
      };
      const units = {temperature:'°C',humidity:'%',pressure:'hPa'};
      const daily = Object.fromEntries(Object.entries(series).map(([metric,sensors]) => [metric,sensors.map(anchors => Array.from({length:184},(_,day) => {
        const position = day/lastDay*(anchors.length-1);
        const index = Math.min(anchors.length-2,Math.floor(position));
        return Math.round((anchors[index]+(anchors[index+1]-anchors[index])*(position-index)+Math.sin(day*1.7)*0.8)*10)/10;
      }))]));
      function values(index) {
        return daily[root.querySelector('.metric').value][index].slice(Math.max(0,Math.ceil(state.start)),Math.min(lastDay,Math.floor(state.end))+1);
      }
      function chart(index, large) {
        const metric = root.querySelector('.metric').value;
        const all = daily[metric].flat();
        const minimum = Math.floor(Math.min(...all)/5)*5-5;
        const maximum = Math.ceil(Math.max(...all)/5)*5+5;
        const height = large ? Math.max(180,content.clientHeight) : (state.density === 'compact' ? 90 : 120);
        const width = Math.max(240, content.clientWidth - (large ? 24 : 58));
        const left = 45, right = width-(large?45:8), top = 22, bottom = height-25;
        if (large) detailGeometry = {left,right,width};
        const points = i => values(i).map((v,j) => `${left+(Math.max(0,Math.ceil(state.start))+j-state.start)/(state.end-state.start)*(right-left)},${bottom-(v-minimum)/(maximum-minimum)*(bottom-top)}`).join(' ');
        let cursor = '';
        if (large && state.inspected !== null && state.inspected >= state.start && state.inspected <= state.end) {
          const x = (left+right)/2;
          const sources = state.compare ? [index,comparisonFor(index)] : [index];
          cursor = `<line class="cursor-line" x1="${x}" x2="${x}" y1="${top}" y2="${bottom}"/>`+sources.map(i => `<circle class="cursor-mark" cx="${x}" cy="${bottom-(daily[metric][i][state.inspected]-minimum)/(maximum-minimum)*(bottom-top)}" r="4"/>`).join('');
        }
        return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Illustrative ${metric} trend for ${escapeMarkup(names[index])}. Fixed center cursor. Drag the chart to inspect samples; pinch to zoom around the cursor."><text x="0" y="12">${units[metric]}</text><line class="grid" x1="${left}" y1="${top}" x2="${right}" y2="${top}"/><line class="grid" x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"/><text x="${left-6}" y="${top+4}" text-anchor="end">${maximum}</text><text x="${left-6}" y="${bottom+4}" text-anchor="end">${minimum}</text><polyline class="trend" points="${points(index)}"/>${large && state.compare ? `<polyline class="trend comparison" points="${points(comparisonFor(index))}"/>` : ''}${cursor}<text x="${left}" y="${height-4}">${dateLabel(state.start)}</text><text x="${right}" y="${height-4}" text-anchor="end">${dateLabel(state.end)}</text></svg>`;
      }
      function render() {
        const detail = state.selected !== null;
        const route = detail ? `sensor-${state.selected}` : 'overview';
        if (updateRoute !== route) {
          updateRoute = route;
          if(connected) connected.enter(state.selected);
          else {
          clearTimeout(updateTimer);
          root.querySelector('.status').textContent = detail ? 'Updating sensor… · demo' : 'Updating saved sensors… · demo';
          updateTimer = setTimeout(() => {
            root.querySelector('.status').textContent = detail ? (state.selected===2?'Sensor unreachable · saved history shown · demo':'Update complete · demo') : `${visibleSensors.length-(visibleSensors.includes(2)?1:0)} updated${visibleSensors.includes(2)?' · '+names[2]+' unreachable · saved data shown':''} · demo`;
          },1600);
          }
        }
        const dataVisible = detail ? hasData(state.selected) : visibleSensors.some(hasData);
        if(comparisonFor(state.selected)===null) state.compare = false;
        if(connected) root.querySelector('.status').textContent = connected.status(state.selected);
        const presentation = connected ? connected.presentation(state.selected) : null;
        retryButton.hidden = !presentation || !presentation.action;
        if(presentation) retryButton.textContent = presentation.action || 'Try again';
        root.querySelector('.controls').hidden = !dataVisible;
        if (detail) {
          const span = state.end-state.start;
          state.inspected = Math.max(0,Math.min(lastDay,Math.round((state.start+state.end)/2)));
          state.start = state.inspected-span/2;
          state.end = state.inspected+span/2;
        }
        root.querySelector('.phone').classList.toggle('detail',detail);
        root.querySelector('.prototype-label').hidden = detail;
        root.querySelector('.time-dock').hidden = true;
        root.querySelector('.overlay-bar').hidden = !detail || !dataVisible || comparisonFor(state.selected)===null;
        root.querySelector('.detail-legend').hidden = !detail || !state.compare;
        root.querySelector('.detail-legend').textContent = detail && state.compare ? `— ${names[state.selected]} · – – ${names[comparisonFor(state.selected)]}` : '';
        root.querySelector('.overlay-compare').setAttribute('aria-pressed',String(state.compare));
        root.querySelector('.overlay-compare').setAttribute('aria-label',state.compare?'Remove comparison':`Compare with ${escapeMarkup(names[comparisonFor(state.selected)])}`);
        root.querySelector('.overlay-compare').setAttribute('data-tooltip',state.compare?'Remove comparison':`Compare with ${escapeMarkup(names[comparisonFor(state.selected)])}`);
        const readout = root.querySelector('.sample-readout');
        readout.hidden = !detail || !dataVisible || state.inspected === null;
        if (!readout.hidden) {
          const sources = state.compare ? [state.selected,comparisonFor(state.selected)] : [state.selected];
          readout.innerHTML = `<div>${dateLabel(state.inspected)} 2026 · 00:00 UTC · demo sample</div>`+sources.map(i => `<p>${escapeMarkup(names[i])}: ${daily.temperature[i][state.inspected]} °C · ${daily.humidity[i][state.inspected]} % · ${daily.pressure[i][state.inspected]} hPa</p>`).join('');
        }
        const timeParent = detail ? root.querySelector('.time-dock') : root.querySelector('header');
        if (timeNavigation.parentElement !== timeParent) {
          if (detail) timeParent.appendChild(timeNavigation);
          else timeParent.insertBefore(timeNavigation,root.querySelector('.status'));
        }
        root.querySelector('.back').hidden = !detail && !externalBack;
        root.querySelector('.back').setAttribute('aria-label',externalBack && (directEntry || !detail)?(connected?.backLabel || 'Back to live'):'Back to history overview');
        root.querySelector('h2').textContent = detail ? names[state.selected] : 'History';
        root.querySelector('.status').hidden = detail && !dataVisible;
        timeNavigation.hidden = !dataVisible;
        root.querySelector('.dates').textContent = `${dateLabel(state.start)} – ${dateLabel(state.end)} 2026 · ${state.end-state.start+1} days`;
        root.querySelector('.window').style.left = `${Math.max(0,state.start)/lastDay*100}%`;
        root.querySelector('.window').style.width = `${(Math.min(lastDay,state.end)-Math.max(0,state.start))/lastDay*100}%`;
        const metric = root.querySelector('.metric').value;
        const summary = i => `Recorded min ${Math.min(...values(i))} ${units[metric]} · max ${Math.max(...values(i))} ${units[metric]}`;
        if(detail && !dataVisible) {
          const view = presentation || {title:'No downloaded history yet',description:''};
          content.innerHTML = `<div class="history-empty">${view.loading?'<progress aria-label="Updating history"></progress>':''}<h3>${escapeMarkup(view.title)}</h3><p>${escapeMarkup(view.description)}</p></div>`;
        } else if (detail) {
          content.innerHTML = `<div class="detail-plot">${chart(state.selected,true)}</div>`;
        } else {
          content.innerHTML = names.map((name,i) => visibleSensors.includes(i) ? `<button class="sensor" type="button" data-sensor="${i}" aria-label="Open ${escapeMarkup(name)} history"><span class="sensor-head"><span>${escapeMarkup(name)}</span><span aria-hidden="true">→</span></span>${hasData(i)?chart(i,false):''}<span class="summary">${hasData(i)?summary(i):escapeMarkup(connected.status(i))}</span></button>` : '').join('');
          if(!visibleSensors.length) content.innerHTML = '<div class="history-empty"><h3>No history-enabled sensors</h3><p>Register a compatible sensor to view its history.</p></div>';
          content.querySelectorAll('[data-sensor]').forEach(button => { button.onclick = () => { state.selected = Number(button.dataset.sensor); state.compare = false; content.scrollTop = 0; render(); }; });
        }
        const retryParent = detail ? (dataVisible?root.querySelector('.phone'):content.querySelector('.history-empty')) : root.querySelector('header');
        retryParent.appendChild(retryButton);
      }
      retryButton.onclick = () => { if(connected) connected.retry(state.selected); };
      root.querySelector('.back').onclick = () => {
        if (externalBack && (directEntry || state.selected === null)) { externalBack(); return; }
        const span = Math.min(lastDay,Math.max(1,Math.round(state.end-state.start)));
        state.start = Math.max(0,Math.min(lastDay-span,Math.round(state.start)));
        state.end = state.start+span;
        state.selected = null; state.compare = false; state.inspected = null; render();
      };
      root.querySelector('.overlay-compare').onclick = () => { state.compare = !state.compare; render(); };
      root.querySelector('.metric').onchange = render;
      function plotFraction(x) {
        const bounds = content.querySelector('svg').getBoundingClientRect();
        const local = (x-bounds.left)/bounds.width*detailGeometry.width;
        return (local-detailGeometry.left)/(detailGeometry.right-detailGeometry.left);
      }
      function setRange(start,span) {
        span = Math.max(1,Math.min(lastDay,span));
        const center = Math.max(0,Math.min(lastDay,Math.round(start+span/2)));
        state.start = center-span/2;
        state.end = state.start+span;
        render();
      }
      const pointers = new Map();
      let gesture = null;
      function beginGesture(tapAllowed) {
        const positions = [...pointers.values()];
        if (!positions.length) { gesture = null; return; }
        const x = positions.reduce((sum,p) => sum+p.x,0)/positions.length;
        gesture = {start:state.start,span:state.end-state.start,x,y:positions[0].y,fraction:plotFraction(x),distance:positions.length>1?Math.max(1,Math.hypot(positions[1].x-positions[0].x,positions[1].y-positions[0].y)):0,moved:!tapAllowed};
      }
      content.onpointerdown = event => {
        if (state.selected === null || !hasData(state.selected) || event.button !== 0) return;
        pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
        content.setPointerCapture(event.pointerId);
        beginGesture(pointers.size===1);
      };
      content.onpointermove = event => {
        if (!pointers.has(event.pointerId) || !gesture) return;
        pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
        const positions = [...pointers.values()];
        if (positions.length>1) {
          gesture.moved = true;
          const distance = Math.max(1,Math.hypot(positions[1].x-positions[0].x,positions[1].y-positions[0].y));
          const span = Math.max(1,Math.min(lastDay,gesture.span*gesture.distance/distance));
          setRange(gesture.start+gesture.span/2-span/2,span);
        } else {
          if (Math.hypot(event.clientX-gesture.x,event.clientY-gesture.y)>6) gesture.moved = true;
          if (gesture.moved) setRange(gesture.start+(gesture.fraction-plotFraction(event.clientX))*gesture.span,gesture.span);
        }
      };
      function endPointer(event,cancelled) {
        if (!pointers.has(event.pointerId)) return;
        pointers.delete(event.pointerId);
        beginGesture(false);
      }
      content.onpointerup = event => endPointer(event,false);
      content.onpointercancel = content.onlostpointercapture = event => endPointer(event,true);
      content.addEventListener('wheel',event => {
        if (state.selected === null || !hasData(state.selected)) return;
        event.preventDefault();
        const span = state.end-state.start;
        if (Math.abs(event.deltaX)>Math.abs(event.deltaY)) setRange(state.start+event.deltaX/600*span,span);
        else {
          const next = Math.max(1,Math.min(lastDay,span*Math.exp(event.deltaY*0.004)));
          setRange(state.start+span/2-next/2,next);
        }
      },{passive:false});
      function moveWindow(kind, delta, start, end) {
        if (kind === 'pan') {
          const shift = Math.max(-start,Math.min(lastDay-end,delta));
          state.start = start+shift;
          state.end = end+shift;
        } else if (kind === 'start') {
          state.start = Math.max(0,Math.min(end-minimumSpan,start+delta));
        } else {
          state.end = Math.min(lastDay,Math.max(start+minimumSpan,end+delta));
        }
        render();
      }
      ['pan','start','end'].forEach(kind => {
        const control = root.querySelector('.'+kind);
        let drag = null;
        control.onpointerdown = event => {
          if (event.button !== 0) return;
          drag = {x:event.clientX,start:state.start,end:state.end,width:root.querySelector('.timeline').getBoundingClientRect().width};
          control.setPointerCapture(event.pointerId);
        };
        control.onpointermove = event => {
          if (!drag) return;
          moveWindow(kind,Math.round((event.clientX-drag.x)/drag.width*lastDay),drag.start,drag.end);
        };
        control.onpointerup = control.onpointercancel = control.onlostpointercapture = () => { drag = null; };
        control.onkeydown = event => {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          moveWindow(kind,(event.key === 'ArrowLeft' ? -1 : 1)*(event.shiftKey ? 7 : 1),state.start,state.end);
        };
      });
      root.querySelector('.all-time').onclick = () => { state.start = 0; state.end = lastDay; render(); };
      render();
      root.historyPrototype = {
        open(index,onBack,labels,available,context=null) {
          connected = context;
          clearTimeout(updateTimer);
          labels.forEach((label,i) => { names[i] = label; });
          visibleSensors = available;
          externalBack = onBack;
          directEntry = index !== null;
          state.selected = index;
          state.compare = false;
          updateRoute = null;
          render();
        },
        refresh() { render(); },
        close() { clearTimeout(updateTimer); pointers.clear(); gesture = null; }
      };
      new ResizeObserver(render).observe(content);
      if (globalThis.Tweak && !root.hasAttribute('data-embedded')) {
        const tweak = new Tweak({container:root,onChange:render});
        tweak.addSelect(state,'density',{label:'Overview chart density',options:['comfortable','compact']});
      }
    })();
  </script>
</div>
